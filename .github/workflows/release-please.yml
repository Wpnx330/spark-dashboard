name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Tags + changelog + version-bump PRs only. No crates.io publishing:
# the crate name is owned by upstream niklasfrick; deploys are
# `cargo install --path` on-node, so releases are tag-only for this fork.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
