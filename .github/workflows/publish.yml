name: publish

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. spark-dashboard-v0.2.0)"
        required: true
        type: string

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-24.04-arm
    # secrets context is NOT allowed in step-level `if:` — gate via job env
    # (job env MAY use secrets) so the step conditions only read env.
    env:
      CARGO_TOKEN_SET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify package contents
        run: cargo package --list --locked --allow-dirty

      - name: Note (fork does not publish to crates.io)
        if: env.CARGO_TOKEN_SET == 'false'
        run: echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish (name owned by upstream niklasfrick). Releases are tag-only for this fork."

      - name: Publish
        if: env.CARGO_TOKEN_SET == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty
